name: Codex review baseline

# Deterministic baseline that the Codex PR review bot (docs/codex-usage.md)
# will build on once API credits are granted. Posts the auditor summary as
# a PR comment so reviewers see the Windows-compatibility delta.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-comment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run maintainer audit (no fail, report only)
        shell: powershell
        run: |
          python skills/gstack-maintainer-auditor/maintainer_auditor.py | Out-File -FilePath audit_stdout.txt -Encoding utf8
          $summary = Select-String -Path "reports/maintainer_audit_report.md" -Pattern "AUDIT ALERT|hardcoded secrets" -SimpleMatch | Select-Object -First 5
          $body = "### Windows compatibility baseline`r`n`r`n"
          $body += "``````text`r`n" + (($summary -join "`r`n")) + "`r`n```````r`n`r`n"
          $body += "_Deterministic baseline. AI-assisted Codex review plugs in here per docs/codex-usage.md._"
          $body | Out-File -FilePath pr_comment.md -Encoding utf8

      - name: Comment baseline on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
